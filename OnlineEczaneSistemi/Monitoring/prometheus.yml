global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'eczane-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'eczane-webapp'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['webapp:8080']
        labels:
          app: 'OnlineEczaneSistemi'
          env: 'production'